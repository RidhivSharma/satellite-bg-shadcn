<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Orbital Paths Visualization</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap');
    body {
      font-family: 'Geist', sans-serif;
    }
  </style>
<style data-purpose="orbit-animations">
    .orbit-line {
      stroke-dasharray: 8 8;
      stroke: #000000;
      stroke-width: 1.5;
      fill: none;
    }
    .orbit-marker {
      fill: #000000;
    }
    .satellite-label {
      font-family: 'Geist', monospace, sans-serif;
      font-size: 10px;
      letter-spacing: 0.12em;
      font-weight: 500;
      fill: #000000;
      opacity: 0.5;
      user-select: none;
    }
  </style>
</head>
<body class="bg-[#FFFFFF] text-black m-0 p-0 overflow-hidden w-full h-screen">
<!-- BEGIN: Main Demo Screen -->
<main class="relative w-full h-full flex items-center justify-center overflow-hidden" data-purpose="orbit-demo-container">
<!-- BEGIN: Background SVG Layer (Underneath Cards) -->
<!-- This SVG is positioned behind the cards (z-0) -->
<svg class="absolute inset-0 w-full h-full z-0 pointer-events-none" data-purpose="background-orbits" preserveaspectratio="xMidYMid slice" viewbox="0 0 1440 900">
<!-- Path 1: Underneath Card B (Right Side) -->
<path class="orbit-line" d="M 1200 1000 C 900 600, 800 300, 1000 -100" id="bg-path-1"></path>
<g data-purpose="satellite-group-landsat">
<circle class="orbit-marker" cx="0" cy="0" r="6"></circle>
<text class="satellite-label" dx="12" dy="3.5">LANDSAT-9</text>
<animatemotion dur="14s" repeatcount="indefinite">
<mpath href="#bg-path-1"></mpath>
</animatemotion>
</g>
<!-- Path 2: Decorative Background Orbit (Top Left to Bottom Right) -->
<path class="orbit-line" d="M -100 100 C 400 300, 900 600, 1500 800" id="bg-path-2"></path>
<g data-purpose="satellite-group-noaa">
<circle class="orbit-marker" cx="0" cy="0" r="6"></circle>
<text class="satellite-label" dx="12" dy="3.5">NOAA-20</text>
<animatemotion dur="20s" repeatcount="indefinite">
<mpath href="#bg-path-2"></mpath>
</animatemotion>
</g>
<!-- Path 3: Decorative Background Orbit (Bottom Left to Top Right) -->
<path class="orbit-line" d="M -200 900 C 300 700, 1100 200, 1600 -100" id="bg-path-3"></path>
<g data-purpose="satellite-group-sentinel">
<circle class="orbit-marker" cx="0" cy="0" r="6"></circle>
<text class="satellite-label" dx="12" dy="3.5">SENTINEL-6A</text>
<animatemotion dur="18s" repeatcount="indefinite">
<mpath href="#bg-path-3"></mpath>
</animatemotion>
</g>
</svg>
<!-- END: Background SVG Layer -->
<!-- BEGIN: Cards Container -->
<!-- The cards reside in a layer between the background and foreground SVGs (z-10) -->
<div class="relative z-10 flex flex-col md:flex-row gap-12 p-8" data-purpose="cards-container">
<!-- Card A: Referenced (Foreground line goes over this) -->
<div class="w-72 h-56 bg-[#FFFFFF] border-2 border-black flex flex-col items-center justify-center p-6 text-center shadow-sm relative" data-purpose="card-referenced">
<h2 class="text-xl font-semibold mb-2">Card A</h2>
<p class="text-sm text-gray-700">Referenced</p>
<p class="text-xs text-gray-500 mt-4 max-w-[180px]">Notice how the orbital line passes <strong>on top</strong> of this element.</p>
</div>
<!-- Card B: Not Referenced (Background line goes under this) -->
<div class="w-72 h-56 bg-[#FFFFFF] border-2 border-black flex flex-col items-center justify-center p-6 text-center shadow-sm relative" data-purpose="card-not-referenced">
<h2 class="text-xl font-semibold mb-2">Card B</h2>
<p class="text-sm text-gray-700">Not Referenced</p>
<p class="text-xs text-gray-500 mt-4 max-w-[180px]">Notice how the orbital line passes <strong>underneath</strong> this element.</p>
</div>
</div>
<!-- END: Cards Container -->
<!-- BEGIN: Foreground SVG Layer (On Top of Cards) -->
<!-- This SVG is positioned in front of the cards (z-20) to overlap Card A -->
<svg class="absolute inset-0 w-full h-full z-20 pointer-events-none" data-purpose="foreground-orbits" preserveaspectratio="xMidYMid slice" viewbox="0 0 1440 900">
<!-- Path 4: Over Card A (Left Side) -->
<path class="orbit-line" d="M 200 -100 C 400 300, 500 600, 300 1000" id="fg-path-1"></path>
<g data-purpose="satellite-group-iss">
<circle class="orbit-marker" cx="0" cy="0" r="6"></circle>
<text class="satellite-label" dx="12" dy="3.5">ISS (ZARYA)</text>
<animatemotion dur="16s" repeatcount="indefinite">
<mpath href="#fg-path-1"></mpath>
</animatemotion>
</g>
</svg>
<!-- END: Foreground SVG Layer -->
</main>
<!-- END: Main Demo Screen -->
</body></html>
